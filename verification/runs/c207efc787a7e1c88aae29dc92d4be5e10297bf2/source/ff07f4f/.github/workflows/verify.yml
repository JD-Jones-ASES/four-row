name: Private verification
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Certificate build or complete release verification
        type: choice
        options: [full, certificates, census]
        default: full
permissions:
  contents: read
concurrency:
  group: four-row-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gram-certificates:
    if: inputs.stage != 'census'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned elan and Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        run: python3 scripts/fetch_mathlib_cache.py
      - name: Restore exact Gram shard cache
        id: gram-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/FourRow/Grams
            .lake/build/ir/FourRow/Grams
          key: ${{ runner.os }}-four-row-grams-${{ matrix.shard }}-of-8-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'FourRow/Grams/*.lean', 'FourRow/PolynomialCertificate.lean') }}
          restore-keys: |
            ${{ runner.os }}-four-row-grams-${{ matrix.shard }}-of-8-
      - name: Build independent Gram shard with bounded memory
        run: python3 scripts/build_grams.py --jobs 1 --shard ${{ matrix.shard }} --shards 8
      - name: Save exact Gram shard cache
        if: steps.gram-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/FourRow/Grams
            .lake/build/ir/FourRow/Grams
          key: ${{ steps.gram-cache.outputs.cache-primary-key }}
      - name: Transfer checked Gram modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gram-proof-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .lake/build/lib/lean/FourRow/Grams
            .lake/build/ir/FourRow/Grams
          retention-days: 7
      - name: Preserve Gram build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gram-log-${{ matrix.shard }}
          include-hidden-files: true
          path: .lake/gram-build/
          retention-days: 90
  census-certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned elan and Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        run: python3 scripts/fetch_mathlib_cache.py
      - name: Restore exact census shard cache
        id: census-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/FourRow/CensusData
            .lake/build/ir/FourRow/CensusData
          key: ${{ runner.os }}-four-row-census-leaves-${{ matrix.shard }}-of-8-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'FourRow/Census*.lean', 'FourRow/CensusData/*.lean', 'FourRow/CensusTableChecks/*.lean', 'FourRow/Finite.lean', 'FourRow/Circuit.lean', 'FourRow/Relabel.lean', 'FourRow/LookupTree.lean') }}
          restore-keys: |
            ${{ runner.os }}-four-row-census-leaves-${{ matrix.shard }}-of-8-
      - name: Check census shard with bounded memory
        run: python3 scripts/build_census_shard.py --shard ${{ matrix.shard }} --shards 8
      - name: Save exact census shard cache
        if: steps.census-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/FourRow/CensusData
            .lake/build/ir/FourRow/CensusData
          key: ${{ steps.census-cache.outputs.cache-primary-key }}
      - name: Transfer checked census modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: census-proof-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .lake/build/lib/lean/FourRow/CensusData
            .lake/build/ir/FourRow/CensusData
          retention-days: 7
      - name: Preserve census build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: census-log-${{ matrix.shard }}
          include-hidden-files: true
          path: build-logs/census-shards/
          retention-days: 90
  verify:
    needs: [gram-certificates, census-certificates]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned elan and Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        run: python3 scripts/fetch_mathlib_cache.py
      - name: Retrieve checked Gram modules from this exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gram-proof-*
          path: .lake/build
          merge-multiple: true
      - name: Retrieve checked census modules from this exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: census-proof-*
          path: .lake/build
          merge-multiple: true
      - name: Check restored certificate artifact layout
        run: python3 scripts/check_certificate_artifacts.py
      - name: Provision memory headroom for complete independent replay
        shell: bash
        run: |
          set -euo pipefail
          # These optional image runtimes are unrelated to this Lean/Python job.
          # Free their disk space before reserving swap on the disposable runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
          python3 - <<'PY'
          import os
          stat = os.statvfs(os.environ['RUNNER_TEMP'])
          available = stat.f_bavail * stat.f_frsize
          required = 20 * 1024**3
          print(f'Available bytes before swap: {available}', flush=True)
          if available < required:
              raise SystemExit('Need 20 GiB free: 16 GiB swap plus 4 GiB runner/log headroom')
          PY
          sudo fallocate -l 16G "$RUNNER_TEMP/four-row.swap"
          sudo chmod 600 "$RUNNER_TEMP/four-row.swap"
          sudo mkswap "$RUNNER_TEMP/four-row.swap"
          sudo swapon "$RUNNER_TEMP/four-row.swap"
          free -h
      - name: Restore exact census proof cache
        id: census-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/FourRow/Census*
            .lake/build/ir/FourRow/Census*
          key: ${{ runner.os }}-four-row-census-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'FourRow/Census*.lean', 'FourRow/CensusData/*.lean', 'FourRow/CensusTableChecks/*.lean', 'FourRow/Finite.lean', 'FourRow/Circuit.lean', 'FourRow/Relabel.lean', 'FourRow/LookupTree.lean') }}
      - name: Build exhaustive census with bounded memory
        run: python3 scripts/build_census.py
      - name: Save exact census proof cache
        if: steps.census-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/FourRow/Census*
            .lake/build/ir/FourRow/Census*
          key: ${{ steps.census-cache.outputs.cache-primary-key }}
      - name: Complete Lean build and axiom audit
        if: inputs.stage == 'full'
        run: |
          python3 scripts/build_grams.py --jobs 1
          lake build
          python3 scripts/audit_release.py
      - name: Independent exact research replay
        if: inputs.stage == 'full'
        run: |
          python3 evidence/probe.py
          python3 evidence/audit_census.py
      - name: Install pinned bubblewrap
        if: inputs.stage == 'full'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config
          git clone --filter=blob:none https://github.com/PalomarRegistry/PalomarSubmission.git "$RUNNER_TEMP/palomar-tools"
          git -C "$RUNNER_TEMP/palomar-tools" checkout d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          echo "COMPARATOR_BWRAP=$("$RUNNER_TEMP/palomar-tools/scripts/install_bwrap.sh" "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"
      - name: Compare statements and replay independent kernels
        if: inputs.stage == 'full'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_comparator.py "$RUNNER_TEMP/four-row-comparator.json"
          /usr/bin/time -v lake comparator --config "$RUNNER_TEMP/four-row-comparator.json" 2>&1 | tee comparator.log
      - name: Record checked source
        if: always()
        run: |
          git rev-parse HEAD > checked-commit.txt
          git status --short > checked-status.txt
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-row-verification-${{ github.sha }}
          include-hidden-files: true
          path: |
            checked-commit.txt
            checked-status.txt
            comparator.log
            axiom-audit.log
            .lake/gram-build/
            build-logs/census/
          if-no-files-found: error
          retention-days: 90
