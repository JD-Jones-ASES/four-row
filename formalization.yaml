version: v0.4
project:
  name: Sharp robustness and stability of the four-row permanent inequality
  description: A formalization of the exact balanced total-variation robustness radius 1/24 for the
    four-row permanent inequality, the optimal variance-deficit coefficient (1-24r)/9, complete nonnegative
    equality cases, and explicit subcritical-exponent and entropy consequences, including sharp endpoint
    entropy constants and tensorization for adaptive permutation histories. The finite endpoint proof
    checks exhaustive support coverage and rational Gram identities in Lean.
  authors:
  - JD Jones
  responsible_maintainers:
  - JD Jones
  license: MIT
classification:
  arxiv:
  - math.CO
  - math.PR
  msc2020:
  - "15A15"
  - "60E15"
  - "26D15"
sources:
- title: Sharp four-row permanent robustness, stability, and entropy
  type: other
  relationship: formalizes
  location: docs/ENDPOINT.md and docs/EXTENSIONS.md
  note: Mathematical source notes for the endpoint, stability, equality, exponent, entropy,
    and adaptive-history results. docs/THEOREMS.md distinguishes formal statements from
    supplementary mathematical consequences.
- title: A strict four-row permanent inequality and permutation moments
  authors:
  - OpenAI
  type: paper
  relationship: adapts
  id: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/A-strict-four-row-permanent-inequality-and-permutation-moments-September-26-2026
  note: 'Direct predecessor: qualitative balanced-law robustness below exponent two and permutation-history
    applications. The present result determines the exact radius at exponent two, the optimal stability
    coefficient, and an explicit sufficient interior exponent. The endpoint and stability are proved
    here by exact certificates.'
- title: An Inequality of Hadamard Type for Permanents
  authors:
  - Eric Carlen
  - Elliott H. Lieb
  - Michael Loss
  type: paper
  relationship: background
  id: arXiv:math/0508096v1
  location: https://arxiv.org/abs/math/0508096v1
  note: Classical sharp uniform permanent inequality at exponent two. The present formalization treats
    a balanced nonuniform total-variation ball.
- title: Entropy inequalities for random walks and permutations
  authors:
  - Alexandre Bristiel
  - Pietro Caputo
  type: paper
  relationship: background
  id: arXiv:2109.06009v3
  location: https://arxiv.org/abs/2109.06009v3
  note: Sharp uniform permanent inequality and entropy background. Its general critical-exponent
    theorem is used in the supplementary informal docs/PROOF.md, not as an assumption in the sixteen
    selected Lean results.
- title: Subadditivity of the entropy and its relation to Brascamp-Lieb type inequalities
  authors:
  - Eric A. Carlen
  - Dario Cordero-Erausquin
  type: paper
  relationship: background
  id: arXiv:0710.0870v2
  location: https://arxiv.org/abs/0710.0870v2
  note: The project proves the required finite duality argument directly.
status:
  scope: Sixteen principal statements for arbitrary real balanced laws in the closed TV ball
    and nonnegative real matrices, including zero rows. The explicit interior exponent is sufficient,
    not claimed optimal. Adaptive kernels may depend on the complete permutation past, with
    assumptions only on positive-probability histories. docs/THEOREMS.md specifies the formal
    scope; docs/VERIFICATION.md records the mechanical checks. The general local-exponent theorem,
    atom geometry, and additional application corollaries are supplementary mathematical results.
